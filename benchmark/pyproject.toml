[project]
name = "link-metrics"
version = "0.1.0"
description = "Control plane for the Link Metrics backend benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.25.1", "openapi-spec-validator==0.7.2", "pyyaml==6.0.3"]

[project.scripts]
link-metrics = "link_metrics.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "schemathesis==4.22.4",
]

[build-system]
requires = ["uv_build==0.8.17"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
