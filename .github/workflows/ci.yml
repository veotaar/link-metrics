name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  discover-contenders:
    runs-on: ubuntu-24.04
    outputs:
      contenders: ${{ steps.discover.outputs.contenders }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
      - run: uv sync --locked
        working-directory: benchmark
      - id: discover
        name: Discover valid Contenders
        shell: bash
        run: |
          contenders="$(cd benchmark && uv run link-metrics contenders discover --root .. | jq --compact-output 'map(.id)')"
          test "$(jq 'length' <<<"$contenders")" -gt 0
          echo "contenders=$contenders" >> "$GITHUB_OUTPUT"

  authorities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 26.2.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: benchmark
      - name: Install pinned dbmate
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/amacneil/dbmate/releases/download/v2.34.1/dbmate-linux-amd64 \
            --output dbmate-linux-amd64
          echo "b002d5249d53d0c6c482ed761b5a806c6fb9a364fcc5f9db3e8763c1d9e40e1d  dbmate-linux-amd64" \
            | sha256sum --check
          sudo install dbmate-linux-amd64 /usr/local/bin/dbmate

      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm lint
      - name: Lint the versioned API Contract
        run: uv run link-metrics contract lint
        working-directory: benchmark
      - name: Run the locked control-plane and PostgreSQL suite
        run: uv run pytest
        working-directory: benchmark

      - name: Verify generated database derivatives
        shell: bash
        run: |
          state="$(cd benchmark && uv run link-metrics contenders start express-node --root ..)"
          test "$(jq --raw-output '.database.status' <<<"$state")" = "running"
          database_url="$(cd benchmark && uv run link-metrics contenders database-url express-node --root .. | jq --raw-output '.url')"

          dbmate \
            --url "$database_url" \
            --migrations-dir database/migrations \
            --schema-file database/schema.sql \
            dump
          git diff --exit-code -- database/schema.sql

          for package_json in backends/*/package.json; do
            if jq --exit-status '.scripts["db:introspect"]' "$package_json" >/dev/null; then
              package_dir="${package_json%/package.json}"
              DATABASE_URL="$database_url" pnpm --dir "$package_dir" db:introspect
            fi
          done
          test -z "$(git status --porcelain --untracked-files=all -- backends)"
      - name: Stop generated-schema environment
        if: always()
        run: cd benchmark && uv run link-metrics contenders stop express-node --root ..

  contender-correctness:
    needs: [discover-contenders, authorities]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        contender: ${{ fromJSON(needs.discover-contenders.outputs.contenders) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
      - run: uv sync --locked
        working-directory: benchmark
      - name: Install pinned dbmate
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/amacneil/dbmate/releases/download/v2.34.1/dbmate-linux-amd64 \
            --output dbmate-linux-amd64
          echo "b002d5249d53d0c6c482ed761b5a806c6fb9a364fcc5f9db3e8763c1d9e40e1d  dbmate-linux-amd64" \
            | sha256sum --check
          sudo install dbmate-linux-amd64 /usr/local/bin/dbmate

      - name: Build and conform ${{ matrix.contender }}
        run: cd benchmark && uv run link-metrics contenders conform "${{ matrix.contender }}" --root ..
      - name: Stop correctness environment
        if: always()
        run: cd benchmark && uv run link-metrics contenders stop "${{ matrix.contender }}" --root ..
